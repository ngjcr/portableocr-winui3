name: Build PortableOCR WinUI 3

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Import bundled OCR runtime
        shell: pwsh
        run: |
          if (-not (Test-Path "PortableOCR-Runtime.zip")) {
            throw "PortableOCR-Runtime.zip is missing from the repository root."
          }
          $runtime = "PortableOCR.WinUI3/runtime"
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          Expand-Archive -Path "PortableOCR-Runtime.zip" -DestinationPath $runtime -Force

      - name: Verify OCR runtime
        shell: pwsh
        run: |
          $required = @(
            "PortableOCR.WinUI3/runtime/engines/tesseract/tesseract.exe",
            "PortableOCR.WinUI3/runtime/engines/tesseract/models/fast/eng.traineddata",
            "PortableOCR.WinUI3/runtime/engines/tesseract/models/balanced/eng.traineddata",
            "PortableOCR.WinUI3/runtime/engines/tesseract/models/best/eng.traineddata",
            "PortableOCR.WinUI3/runtime/engines/poppler/bin/pdfinfo.exe",
            "PortableOCR.WinUI3/runtime/engines/poppler/bin/pdftoppm.exe",
            "PortableOCR.WinUI3/runtime/engines/poppler/bin/pdfunite.exe",
            "PortableOCR.WinUI3/runtime/engines/poppler/bin/pdfseparate.exe",
            "PortableOCR.WinUI3/runtime/engines/poppler/bin/pdftotext.exe",
            "PortableOCR.WinUI3/runtime/engines/preprocess/preprocess.exe"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Missing portable runtime file: $file"
            }
          }

      - name: Restore
        run: dotnet restore PortableOCR-WinUI3.sln

      - name: Publish portable x64
        shell: pwsh
        run: |
          dotnet publish PortableOCR.WinUI3/PortableOCR.WinUI3.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:WindowsAppSDKSelfContained=true `
            -p:PublishTrimmed=false `
            -p:PublishSingleFile=false `
            -o "$env:GITHUB_WORKSPACE/publish/PortableOCR"

      - name: Verify portable executable
        shell: pwsh
        run: |
          if (-not (Test-Path "publish/PortableOCR/PortableOCR.exe")) {
            throw "PortableOCR.exe was not produced."
          }
          if (-not (Test-Path "publish/PortableOCR/runtime/engines/tesseract/tesseract.exe")) {
            throw "Tesseract was not copied into the portable folder."
          }
          if (-not (Test-Path "publish/PortableOCR/runtime/engines/preprocess/preprocess.exe")) {
            throw "Preprocessing engine was not copied into the portable folder."
          }

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: PortableOCR-WinUI3-Windows-x64
          path: publish/PortableOCR
          if-no-files-found: error
